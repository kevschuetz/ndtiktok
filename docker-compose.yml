# nd-content on the shared host. Resource-capped so it can never starve polymarkt-watch.
# CLI services (ndc, ndc-heavy): no ports, no restart policy, own volume.
# ndc-review: the only long-running service — phone review UI, 127.0.0.1 only (SSH tunnel),
# NO secrets (no env_file), read-only rootfs, no capabilities (D-17..D-19).
name: nd-content

services:
  ndc:
    build: .
    image: nd-content:dev
    mem_limit: 1g
    memswap_limit: 1g
    cpus: "1.0"
    env_file:
      - path: .env
        required: false
    volumes:
      - /home/nd-content-volumes/data:/data
      - ./config:/app/config:ro
      - ./docs:/app/docs
      - ./scan:/app/scan
      - ./src:/app/src
      - ./tests:/app/tests
    working_dir: /app
    entrypoint: ["uv", "run", "--no-sync", "ndc"]

  # Heavy local analysis (plan 01-06, D-17): yt-dlp media download, faster-whisper, PyAV, Pillow.
  # Capped harder than its share and niced, single thread; run on demand only:
  #   docker compose run --rm ndc-heavy scan analyze
  # Commands refuse 00:15-06:00 UTC (quiet hours) unless --force.
  ndc-heavy:
    build: .
    image: nd-content:dev
    mem_limit: 3g
    memswap_limit: 3g
    cpus: "1.0"
    env_file:
      - path: .env
        required: false
    environment:
      OMP_NUM_THREADS: "1"
      HF_HOME: /data/models/hf
    volumes:
      - /home/nd-content-volumes/data:/data
      - ./config:/app/config:ro
      - ./docs:/app/docs
      - ./scan:/app/scan
      - ./src:/app/src
      - ./tests:/app/tests
    working_dir: /app
    entrypoint: ["nice", "-n", "19", "uv", "run", "--no-sync", "ndc"]

  ndc-review:
    build: .
    image: nd-content:dev
    entrypoint: ["/app/.venv/bin/ndc", "review", "serve", "--host", "0.0.0.0", "--port", "8090"]
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      NDC_DB: /data/ndc.db
      NDC_CONFIG_DIR: /app/config
      NDC_ENV_FILE: /nonexistent
    volumes:
      - /home/nd-content-volumes/data:/data
      - ./config:/app/config:ro
    working_dir: /app
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    memswap_limit: 256m
    cpus: "0.25"
    restart: unless-stopped

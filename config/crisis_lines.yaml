# nd-content crisis-line set (MKT-03, plan 01-14). German / DACH only (language decision R1, D-08).
# Every entry was re-checked against the official source on verified_at (plain GET of the page,
# text read for number + hours). Re-verify before Phase 3 OPS-01 and whenever a number is used in
# a new template. confirmed: false = could not be confirmed from the official source.
# EXEMPT from `ndc check` (it legitimately names crisis/suicide services).
# Loaded by src/ndc/launch_sets.py.
version: 1
language: de
approved_at: 2026-10-25   # operator reviewed and approved the set ("Approved")

# Pinned-comment short form (emotions / burnout / crisis-adjacent topics).
short_form: "Wenn es dir gerade nicht gut geht: AT 142 · DE 0800 111 0 111 · CH 143 (rund um die Uhr, kostenlos). Im Notfall 144 / 112."


# LLM configuration (SCR-06, D-02). Model IDs, effort, limits, prompts and prices live ONLY here —
# never in src/. Draft and verify must use different models (enforced by load_llm_config).
draft:
  model: claude-opus-5-5
  effort: high          # Opus 5.5 always thinks; effort is the only depth control (default medium)
  max_tokens: 8000      # thinking tokens count against this — 1500 truncated in the 2026-10-26 probe
  prompt: prompts/draft_de.md
  append_files: [style_guide.md, prompts/engagement_playbook.md]  # appended verbatim
  word_range: [140, 190]           # style_guide.md §1 word budget; outside = review warning
editor:   # TikTok punch-up pass (D-21); output is always re-verified
  model: claude-opus-5-5
  effort: high
  max_tokens: 8000
  prompt: prompts/editor_de.md
  append_files: [style_guide.md, prompts/engagement_playbook.md]
verify:
  model: claude-sonnet-5-5
  effort: high
  max_tokens: 8000
  prompt: prompts/verify_de.md
# USD per million tokens. null = unknown -> cost_usd stays NULL and one WARNING is logged.
prices:
  claude-opus-5-5: {input: 4.0, output: 20.0, cache_read: 0.20, cache_write_5m: 5.0}
  claude-sonnet-5-5: {input: null, output: null, cache_read: null, cache_write_5m: null}  # operator: fill from the Anthropic pricing page
